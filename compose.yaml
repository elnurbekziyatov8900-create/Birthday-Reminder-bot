services:
  db:
    image: postgres:16-alpine
    container_name: family_birthday_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: birthday_db
      POSTGRES_USER: birthday_user
      POSTGRES_PASSWORD: elnurbirthdaybot
    ports:
      - "5437:5432"
    volumes:
      - birthday_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U birthday_user -d birthday_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    container_name: family_birthday_bot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  birthday_pgdata:
